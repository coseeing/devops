[project]
name = "vms-portal"
version = "0.1.0"
description = "Shared portal for managed Windows A11y EC2 instances"
requires-python = ">=3.12,<3.15"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
vms-portal = "vms_portal.__main__:main"
vms-portal-secret = "vms_portal.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vms_portal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
