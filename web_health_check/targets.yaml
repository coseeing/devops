defaults:
  check_interval_seconds: 60   # 每分鐘檢查一次
  timeout_seconds: 10          # 單次請求逾時秒數
  max_attempts: 3              # 單輪最多測 3 次
  retry_delay_seconds: 5       # 重試間隔秒數
  remind_interval_minutes: 30  # 持續 down 的重複提醒間隔

targets:
  - name: A11yvillage Frontend
    url: https://a11yvillage.coseeing.org
  - name: A11yvillage Backend API
    url: https://api-a11yvillage.coseeing.org/blog/api/
  - name: Coseeing Frontend
    url: https://coseeing.org
  - name: Coseeing Backend API
    url: https://api.coseeing.org/about/api/
  - name: Twvip Frontend
    url: https://www.twvip.org/
  - name: Twvip Backend API
    url: https://api.twvip.org/admin/
