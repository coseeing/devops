AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege runtime access for the Windows VM portal

Parameters:
  ExistingRoleName:
    Type: String
    Default: coseeing-ec2-common
  AuthSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:ap-northeast-1:[0-9]{12}:secret:.+$'
  LogRetentionDays:
    Type: Number
    Default: 90
  ShutdownCodeS3Bucket:
    Type: String
  ShutdownCodeS3Key:
    Type: String
  ShutdownCodeS3Version:
    Type: String

Resources:
  AuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /coseeing/vms-portal
      RetentionInDays: !Ref LogRetentionDays

  ShutdownDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600

  ShutdownLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  ShutdownLambdaPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: vms-portal-nightly-shutdown
      Roles:
        - !Ref ShutdownLambdaRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DescribeManagedInstances
            Effect: Allow
            Action:
              - ec2:DescribeInstances
            Resource: "*"
          - Sid: StopManagedInstances
            Effect: Allow
            Action:
              - ec2:StopInstances
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
            Condition:
              StringEquals:
                aws:ResourceTag/VmPortalManaged: "true"

  ShutdownLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt ShutdownLambdaRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        S3Bucket: !Ref ShutdownCodeS3Bucket
        S3Key: !Ref ShutdownCodeS3Key
        S3ObjectVersion: !Ref ShutdownCodeS3Version

  ShutdownSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-nightly-shutdown
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ShutdownLambda.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ShutdownDeadLetterQueue.Arn

  NightlyShutdownSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Stop all running VmPortalManaged Windows instances every night
      ScheduleExpression: cron(0 1 * * ? *)
      ScheduleExpressionTimezone: Asia/Taipei
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt ShutdownLambda.Arn
        RoleArn: !GetAtt ShutdownSchedulerRole.Arn
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 3
        DeadLetterConfig:
          Arn: !GetAtt ShutdownDeadLetterQueue.Arn

  PortalPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: vms-portal-runtime
      Roles:
        - !Ref ExistingRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DescribeInstances
            Effect: Allow
            Action:
              - ec2:DescribeInstances
            Resource: "*"
          - Sid: DescribeManagedElasticIps
            Effect: Allow
            Action:
              - ec2:DescribeAddresses
            Resource: "*"
          - Sid: StartStopManagedInstances
            Effect: Allow
            Action:
              - ec2:StartInstances
              - ec2:StopInstances
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
            Condition:
              StringEquals:
                aws:ResourceTag/VmPortalManaged: "true"
          - Sid: ReadPortalAuthSecret
            Effect: Allow
            Action:
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
            Resource: !Ref AuthSecretArn
          - Sid: ReadResourceCosts
            Effect: Allow
            Action:
              - ce:GetCostAndUsageWithResources
            Resource: "*"
          - Sid: WritePortalLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub ${AuditLogGroup.Arn}:*

Outputs:
  LogGroupName:
    Value: !Ref AuditLogGroup
