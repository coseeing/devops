Resources:
  WindowsInstance001:
    Type: AWS::EC2::Instance
    Condition: CreateSlot001
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfileName
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref SecurityGroupId
          AssociatePublicIpAddress: false
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref DiskSize
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-001"
        - Key: VmPortalManaged
          Value: "true"
        - Key: VmPortalStack
          Value: !Ref "AWS::StackName"
        - Key: VmPortalInstanceIndex
          Value: "001"
  ElasticIp001:
    Type: AWS::EC2::EIP
