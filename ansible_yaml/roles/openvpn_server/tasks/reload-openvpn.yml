---
# An included handler's rescue does not handle failures during flush_handlers.
# Accept only the known unsupported-reload errors here so the next handler task
# can restart; all other errors still enter the activation block's rollback.
- name: Reload course OpenVPN via systemd
  ansible.builtin.systemd_service:
    name: openvpn-server@course
    state: reloaded
  register: openvpn_reload_result
  failed_when:
    - openvpn_reload_result is failed
    - "'Job type reload is not applicable' not in (openvpn_reload_result.msg | default(''))"
    - "'not supported' not in (openvpn_reload_result.msg | default(''))"

- name: Restart course OpenVPN when reload is unsupported
  ansible.builtin.systemd_service:
    name: openvpn-server@course
    state: restarted
  when: >-
    'Job type reload is not applicable' in (openvpn_reload_result.msg | default(''))
    or 'not supported' in (openvpn_reload_result.msg | default(''))
