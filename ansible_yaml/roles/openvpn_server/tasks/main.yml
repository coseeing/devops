---
- name: Validate OpenVPN deployment inputs before mutation
  block:
    - name: Validate required OpenVPN variables
      ansible.builtin.assert:
        that:
          - openvpn_endpoint | default("") | length > 0
          - openvpn_vpn_cidr | default("") | length > 0
          - openvpn_windows_cidr | default("") | length > 0
          - openvpn_vpc_cidr | default("") | length > 0
          - openvpn_profile_bucket | default("") | length > 0
          - openvpn_client_days | default(0) | int >= 1
          - openvpn_client_days | default(0) | int <= 365

    - name: Copy OpenVPN input validator before mutation
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/validate-openvpn-inputs.py"
        dest: /tmp/validate-openvpn-inputs.py
        owner: root
        group: root
        mode: "0755"

    - name: Validate normalized network inputs before mutation
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /tmp/validate-openvpn-inputs.py
          - --endpoint
          - "{{ openvpn_endpoint }}"
          - --vpn-cidr
          - "{{ openvpn_vpn_cidr }}"
          - --windows-cidr
          - "{{ openvpn_windows_cidr }}"
          - --vpc-cidr
          - "{{ openvpn_vpc_cidr }}"
          - --client-days
          - "{{ openvpn_client_days | string }}"
      changed_when: false
  always:
    - name: Remove OpenVPN input validator after preflight
      ansible.builtin.file:
        path: /tmp/validate-openvpn-inputs.py
        state: absent

- name: Install native OpenVPN packages
  ansible.builtin.apt:
    name:
      - openvpn
      - easy-rsa
      - nftables
      - openssl
      - ca-certificates
      - curl
      - unzip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check AWS CLI in /usr/local/bin
  ansible.builtin.stat:
    path: /usr/local/bin/aws
  register: openvpn_aws_cli_local

- name: Check AWS CLI in /usr/bin
  ansible.builtin.stat:
    path: /usr/bin/aws
  register: openvpn_aws_cli_usr

- name: Install AWS CLI v2 when missing
  when:
    - not openvpn_aws_cli_local.stat.exists
    - not openvpn_aws_cli_usr.stat.exists
  block:
    - name: Create AWS CLI installer directory
      ansible.builtin.tempfile:
        state: directory
        suffix: openvpn-awscli
      register: openvpn_aws_cli_temp

    - name: Download AWS CLI v2 installer
      ansible.builtin.get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: "{{ openvpn_aws_cli_temp.path }}/awscliv2.zip"
        mode: "0600"

    - name: Unpack AWS CLI v2 installer
      ansible.builtin.unarchive:
        src: "{{ openvpn_aws_cli_temp.path }}/awscliv2.zip"
        dest: "{{ openvpn_aws_cli_temp.path }}"
        remote_src: true

    - name: Run AWS CLI v2 installer
      ansible.builtin.command:
        argv:
          - "{{ openvpn_aws_cli_temp.path }}/aws/install"
          - --bin-dir
          - /usr/local/bin
          - --install-dir
          - /usr/local/aws-cli
          - --update
        creates: /usr/local/bin/aws
  always:
    - name: Remove AWS CLI installer directory
      ansible.builtin.file:
        path: "{{ openvpn_aws_cli_temp.path }}"
        state: absent
      when: openvpn_aws_cli_temp is defined

- name: Select AWS CLI path
  ansible.builtin.set_fact:
    openvpn_aws_cli_path: >-
      {{ '/usr/local/bin/aws' if openvpn_aws_cli_local.stat.exists else
      ('/usr/bin/aws' if openvpn_aws_cli_usr.stat.exists else '/usr/local/bin/aws') }}

- name: Verify S3 profile bucket when requested
  ansible.builtin.command:
    argv:
      - "{{ openvpn_aws_cli_path }}"
      - s3api
      - head-bucket
      - --bucket
      - "{{ openvpn_profile_bucket }}"
      - --region
      - "{{ openvpn_aws_region }}"
  changed_when: false
  when: openvpn_verify_s3 | bool

- name: Create OpenVPN root-only directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ openvpn_pki_dir }}"
      mode: "0700"
    - path: "{{ openvpn_profile_dir }}"
      mode: "0700"
    - path: "{{ openvpn_server_dir }}"
      mode: "0700"
    - path: "{{ openvpn_status_path | dirname }}"
      mode: "0755"

- name: Copy Easy-RSA tree into OpenVPN PKI directory
  ansible.builtin.copy:
    src: /usr/share/easy-rsa/
    dest: "{{ openvpn_pki_dir }}/"
    remote_src: true
    owner: root
    group: root
    mode: preserve

- name: Lock OpenVPN PKI directory permissions
  ansible.builtin.file:
    path: "{{ openvpn_pki_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Initialize Easy-RSA PKI once
  ansible.builtin.command:
    argv: ["{{ openvpn_pki_dir }}/easyrsa", init-pki]
    chdir: "{{ openvpn_pki_dir }}"
    creates: "{{ openvpn_pki_dir }}/pki/index.txt"
  environment:
    EASYRSA_BATCH: "1"
    EASYRSA_ALGO: rsa
    EASYRSA_KEY_SIZE: "3072"

- name: Build private CA once
  ansible.builtin.command:
    argv: ["{{ openvpn_pki_dir }}/easyrsa", build-ca, nopass]
    chdir: "{{ openvpn_pki_dir }}"
    creates: "{{ openvpn_pki_dir }}/pki/ca.crt"
  environment:
    EASYRSA_BATCH: "1"
    EASYRSA_ALGO: rsa
    EASYRSA_KEY_SIZE: "3072"
    EASYRSA_REQ_CN: Course OpenVPN CA

- name: Build server certificate once
  ansible.builtin.command:
    argv:
      - "{{ openvpn_pki_dir }}/easyrsa"
      - build-server-full
      - "{{ openvpn_server_cn }}"
      - nopass
    chdir: "{{ openvpn_pki_dir }}"
    creates: "{{ openvpn_pki_dir }}/pki/issued/{{ openvpn_server_cn }}.crt"
  environment:
    EASYRSA_BATCH: "1"
    EASYRSA_ALGO: rsa
    EASYRSA_KEY_SIZE: "3072"

- name: Build initial shared client certificate once
  ansible.builtin.command:
    argv:
      - "{{ openvpn_pki_dir }}/easyrsa"
      - build-client-full
      - "{{ openvpn_initial_client_cn }}"
      - nopass
    chdir: "{{ openvpn_pki_dir }}"
    creates: "{{ openvpn_pki_dir }}/pki/issued/{{ openvpn_initial_client_cn }}.crt"
  environment:
    EASYRSA_BATCH: "1"
    EASYRSA_ALGO: rsa
    EASYRSA_KEY_SIZE: "3072"
    EASYRSA_CERT_EXPIRE: "{{ openvpn_client_days | string }}"

- name: Generate initial certificate revocation list once
  ansible.builtin.command:
    argv: ["{{ openvpn_pki_dir }}/easyrsa", gen-crl]
    chdir: "{{ openvpn_pki_dir }}"
    creates: "{{ openvpn_pki_dir }}/pki/crl.pem"
  environment:
    EASYRSA_BATCH: "1"

- name: Generate tls-crypt key once
  ansible.builtin.command:
    argv:
      - openvpn
      - --genkey
      - secret
      - "{{ openvpn_pki_dir }}/tls-crypt.key"
    creates: "{{ openvpn_pki_dir }}/tls-crypt.key"

- name: Lock tls-crypt key permissions
  ansible.builtin.file:
    path: "{{ openvpn_pki_dir }}/tls-crypt.key"
    owner: root
    group: root
    mode: "0600"

- name: Check existing active client CN
  ansible.builtin.stat:
    path: "{{ openvpn_active_client_cn_file }}"
    follow: false
  register: openvpn_active_client_cn_stat

- name: Refuse symlinked active client CN state
  ansible.builtin.assert:
    that:
      - not openvpn_active_client_cn_stat.stat.islnk
  when: openvpn_active_client_cn_stat.stat.exists

- name: Read existing active client CN
  ansible.builtin.slurp:
    src: "{{ openvpn_active_client_cn_file }}"
  register: openvpn_existing_active_client_cn
  when: openvpn_active_client_cn_stat.stat.exists
  no_log: true

- name: Resolve active client CN
  ansible.builtin.set_fact:
    openvpn_active_client_cn: >-
      {{ (openvpn_existing_active_client_cn.content | b64decode | trim)
      if openvpn_active_client_cn_stat.stat.exists else openvpn_initial_client_cn }}

- name: Validate active client CN
  ansible.builtin.assert:
    that:
      - openvpn_active_client_cn is match("^[A-Za-z0-9][A-Za-z0-9-]{0,63}$")

- name: Store initial active client CN once
  ansible.builtin.copy:
    dest: "{{ openvpn_active_client_cn_file }}"
    content: "{{ openvpn_active_client_cn }}\n"
    owner: root
    group: root
    mode: "0600"
  when: not openvpn_active_client_cn_stat.stat.exists

- name: Lock active client CN permissions
  ansible.builtin.file:
    path: "{{ openvpn_active_client_cn_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Check recorded shared profile key
  ansible.builtin.stat:
    path: "{{ openvpn_last_shared_key_file }}"
    follow: false
  register: openvpn_last_shared_key_stat

- name: Refuse symlinked shared profile key state
  ansible.builtin.assert:
    that:
      - not openvpn_last_shared_key_stat.stat.islnk
  when: openvpn_last_shared_key_stat.stat.exists

- name: Create recorded shared profile key file once
  ansible.builtin.copy:
    dest: "{{ openvpn_last_shared_key_file }}"
    content: ""
    owner: root
    group: root
    mode: "0600"
  when: not openvpn_last_shared_key_stat.stat.exists

- name: Lock recorded shared profile key permissions
  ansible.builtin.file:
    path: "{{ openvpn_last_shared_key_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Install OpenVPN profile renderer in PKI
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/openvpn-course-render-profile"
    dest: "{{ openvpn_pki_dir }}/render-profile"
    owner: root
    group: root
    mode: "0750"

- name: Install OpenVPN course operator
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/openvpn-course"
    dest: /usr/local/sbin/openvpn-course
    owner: root
    group: root
    mode: "0750"

- name: Install OpenVPN course firewall helper
  ansible.builtin.copy:
    dest: /usr/local/sbin/openvpn-course-firewall
    owner: root
    group: root
    mode: "0750"
    content: |
      #!/usr/bin/env sh
      set -eu

      case "${1:-apply}" in
        apply|reload)
          sysctl -w net.ipv4.ip_forward=1 >/dev/null
          nft delete table inet openvpn_course 2>/dev/null || true
          nft delete table ip openvpn_course_nat 2>/dev/null || true
          nft -f - <<'NFT'
      table inet openvpn_course {
        chain forward {
          type filter hook forward priority 0; policy accept;
          iifname "{{ openvpn_tunnel_device }}" ip saddr {{ openvpn_vpn_cidr }} ip daddr {{ openvpn_windows_cidr }} accept
          oifname "{{ openvpn_tunnel_device }}" ip saddr {{ openvpn_windows_cidr }} ip daddr {{ openvpn_vpn_cidr }} ct state established,related accept
        }
      }
      table ip openvpn_course_nat {
        chain postrouting {
          type nat hook postrouting priority srcnat; policy accept;
          ip saddr {{ openvpn_vpn_cidr }} ip daddr {{ openvpn_windows_cidr }} masquerade
        }
      }
      NFT
          ;;
        stop)
          nft delete table inet openvpn_course 2>/dev/null || true
          nft delete table ip openvpn_course_nat 2>/dev/null || true
          ;;
        *)
          printf 'usage: openvpn-course-firewall {apply|reload|stop}\n' >&2
          exit 2
          ;;
      esac

- name: Install OpenVPN course firewall unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/openvpn-course-firewall.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=OpenVPN course split-tunnel firewall
      Wants=network-online.target
      After=network-online.target nftables.service
      Before=openvpn-server@course.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/openvpn-course-firewall apply
      ExecReload=/usr/local/sbin/openvpn-course-firewall reload
      ExecStop=/usr/local/sbin/openvpn-course-firewall stop

      [Install]
      WantedBy=multi-user.target
  notify: Reload systemd

- name: Reload systemd before starting firewall unit
  ansible.builtin.meta: flush_handlers

- name: Render staged OpenVPN server configuration
  ansible.builtin.template:
    src: course.conf.j2
    dest: "{{ openvpn_server_config_path }}.staged"
    owner: root
    group: root
    mode: "0600"

- name: Render staged OpenVPN operator environment
  ansible.builtin.template:
    src: openvpn-course.env.j2
    dest: /etc/openvpn/openvpn-course.env.staged
    owner: root
    group: root
    mode: "0600"

- name: Render staged active client profile
  ansible.builtin.command:
    argv:
      - "{{ openvpn_pki_dir }}/render-profile"
      - "{{ openvpn_active_client_cn }}"
  environment:
    PKI_DIR: "{{ openvpn_pki_dir }}"
    ENDPOINT: "{{ openvpn_endpoint }}"
    OPENVPN_PORT: "{{ openvpn_port | string }}"
    OPENVPN_PROTOCOL: "{{ openvpn_protocol }}"
  register: openvpn_rendered_profile
  changed_when: false
  no_log: true

- name: Write staged active client profile
  ansible.builtin.copy:
    dest: "{{ openvpn_profile_path }}.staged"
    content: "{{ openvpn_rendered_profile.stdout }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Define OpenVPN active file transaction set
  ansible.builtin.set_fact:
    openvpn_active_files:
      - path: /etc/openvpn/server/ca.crt
        source: "{{ openvpn_pki_dir }}/pki/ca.crt"
        mode: "0644"
        secret: false
        install_before_validation: true
      - path: /etc/openvpn/server/course-server.crt
        source: "{{ openvpn_pki_dir }}/pki/issued/{{ openvpn_server_cn }}.crt"
        mode: "0644"
        secret: false
        install_before_validation: true
      - path: /etc/openvpn/server/course-server.key
        source: "{{ openvpn_pki_dir }}/pki/private/{{ openvpn_server_cn }}.key"
        mode: "0600"
        secret: true
        install_before_validation: true
      - path: /etc/openvpn/server/crl.pem
        source: "{{ openvpn_pki_dir }}/pki/crl.pem"
        mode: "0644"
        secret: false
        install_before_validation: true
      - path: /etc/openvpn/server/tls-crypt.key
        source: "{{ openvpn_pki_dir }}/tls-crypt.key"
        mode: "0600"
        secret: true
        install_before_validation: true
      - path: /etc/openvpn/server/course.conf
        source: /etc/openvpn/server/course.conf.staged
        mode: "0600"
        secret: false
        install_before_validation: false
      - path: "{{ openvpn_profile_path }}"
        source: "{{ openvpn_profile_path }}.staged"
        mode: "0600"
        secret: true
        install_before_validation: false
      - path: /etc/openvpn/openvpn-course.env
        source: /etc/openvpn/openvpn-course.env.staged
        mode: "0600"
        secret: false
        install_before_validation: false

- name: Remove stale OpenVPN activation backups
  ansible.builtin.file:
    path: "{{ item.path }}.previous"
    state: absent
  loop: "{{ openvpn_active_files }}"
  no_log: "{{ item.secret }}"

- name: Check previous course server configuration
  ansible.builtin.stat:
    path: "{{ openvpn_server_config_path }}"
  register: openvpn_previous_server_config

- name: Check existing active OpenVPN files
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop: "{{ openvpn_active_files }}"
  register: openvpn_active_file_stats
  no_log: "{{ item.secret }}"

- name: Refuse symlinked active OpenVPN files
  ansible.builtin.assert:
    that:
      - not item.stat.islnk
  loop: "{{ openvpn_active_file_stats.results }}"
  when: item.stat.exists
  no_log: "{{ item.item.secret }}"

- name: Backup existing active OpenVPN files
  ansible.builtin.copy:
    src: "{{ item.item.path }}"
    dest: "{{ item.item.path }}.previous"
    remote_src: true
    owner: root
    group: root
    mode: "{{ item.item.mode }}"
  loop: "{{ openvpn_active_file_stats.results }}"
  when: item.stat.exists
  no_log: "{{ item.item.secret }}"

- name: Activate OpenVPN artifacts transactionally
  block:
    - name: Install server material before validation
      ansible.builtin.copy:
        src: "{{ item.source }}"
        dest: "{{ item.path }}"
        remote_src: true
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop: "{{ openvpn_active_files }}"
      when: item.install_before_validation
      no_log: "{{ item.secret }}"
      notify: Reload course OpenVPN

    - name: Verify staged server certificate
      ansible.builtin.command:
        argv: [openssl, verify, -CAfile, /etc/openvpn/server/ca.crt, /etc/openvpn/server/course-server.crt]
      changed_when: false

    - name: Verify staged client certificate
      ansible.builtin.command:
        argv:
          - openssl
          - verify
          - -CAfile
          - "{{ openvpn_pki_dir }}/pki/ca.crt"
          - "{{ openvpn_pki_dir }}/pki/issued/{{ openvpn_active_client_cn }}.crt"
      changed_when: false

    - name: Validate rendered profile contains required blocks
      ansible.builtin.command:
        argv:
          - grep
          - -Fq
          - "{{ item }}"
          - "{{ openvpn_profile_path }}.staged"
      loop:
        - <ca>
        - <cert>
        - <key>
        - <tls-crypt>
      changed_when: false
      no_log: true

    - name: Parse and crypto-test staged OpenVPN configuration
      ansible.builtin.command:
        argv: [openvpn, --config, /etc/openvpn/server/course.conf.staged, --test-crypto]
      changed_when: false
      no_log: true

    - name: Install validated active OpenVPN files
      ansible.builtin.copy:
        src: "{{ item.source }}"
        dest: "{{ item.path }}"
        remote_src: true
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop: "{{ openvpn_active_files }}"
      when: not item.install_before_validation
      no_log: "{{ item.secret }}"
      notify: Reload course OpenVPN

    - name: Enable and start course firewall
      ansible.builtin.systemd_service:
        name: openvpn-course-firewall
        enabled: true
        state: started

    - name: Enable and start course OpenVPN
      ansible.builtin.systemd_service:
        name: openvpn-server@course
        enabled: true
        state: started

    - name: Flush OpenVPN activation handlers
      ansible.builtin.meta: flush_handlers

    - name: Verify course OpenVPN service is active
      ansible.builtin.command:
        argv: [systemctl, is-active, --quiet, openvpn-server@course]
      changed_when: false
  rescue:
    - name: Restore previous active OpenVPN files
      ansible.builtin.copy:
        src: "{{ item.item.path }}.previous"
        dest: "{{ item.item.path }}"
        remote_src: true
        owner: root
        group: root
        mode: "{{ item.item.mode }}"
      loop: "{{ openvpn_active_file_stats.results }}"
      when: item.stat.exists
      no_log: "{{ item.item.secret }}"

    - name: Remove active OpenVPN files created by failed first deploy
      ansible.builtin.file:
        path: "{{ item.item.path }}"
        state: absent
      loop: "{{ openvpn_active_file_stats.results }}"
      when: not item.stat.exists
      no_log: "{{ item.item.secret }}"

    - name: Reload course firewall after rollback
      ansible.builtin.systemd_service:
        name: openvpn-course-firewall
        state: reloaded
      failed_when: false

    - name: Reload course OpenVPN after rollback
      ansible.builtin.systemd_service:
        name: openvpn-server@course
        state: reloaded
      failed_when: false
      when: openvpn_previous_server_config.stat.exists

    - name: Stop course OpenVPN after failed first deploy
      ansible.builtin.systemd_service:
        name: openvpn-server@course
        state: stopped
      failed_when: false
      when: not openvpn_previous_server_config.stat.exists

    - name: Fail after OpenVPN activation rollback
      ansible.builtin.fail:
        msg: OpenVPN activation failed; previous configuration restored

- name: Remove staged OpenVPN activation files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/openvpn/server/course.conf.staged
    - /etc/openvpn/openvpn-course.env.staged
    - "{{ openvpn_profile_path }}.staged"

- name: Remove OpenVPN activation backups after success
  ansible.builtin.file:
    path: "{{ item.path }}.previous"
    state: absent
  loop: "{{ openvpn_active_files }}"
  no_log: "{{ item.secret }}"
