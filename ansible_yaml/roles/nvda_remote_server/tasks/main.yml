---
- name: Validate NVDA Remote server inputs
  ansible.builtin.assert:
    that:
      - nvda_remote_port | int >= 1024
      - nvda_remote_port | int <= 65535
      - nvda_remote_image is search('@sha256:[a-f0-9]{64}$')
      - nvda_remote_loglevel | int in [0, 1, 2]
      - nvda_remote_cert_ips | length > 0
    fail_msg: >-
      NVDA Remote needs an unprivileged port, a digest-pinned image, a
      log level that never records channel keys (0-2), and at least one
      certificate IP address.

- name: Require the existing Docker engine
  ansible.builtin.command:
    argv: [docker, version, --format, "{{ '{{' }}.Server.Version{{ '}}' }}"]
  changed_when: false

- name: Create NVDA Remote data directory
  ansible.builtin.file:
    path: "{{ nvda_remote_data_dir }}"
    state: directory
    owner: root
    group: "{{ nvda_remote_gid }}"
    mode: "0750"

- name: Install NVDA Remote certificate helper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/nvda-remote-cert"
    dest: /usr/local/libexec/nvda-remote-cert
    owner: root
    group: root
    mode: "0750"

- name: Ensure NVDA Remote private CA and server certificate
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/nvda-remote-cert
      - ensure
      - "{{ nvda_remote_cert_ips | join(',') }}"
  environment:
    NVDA_REMOTE_CA_DIR: "{{ nvda_remote_ca_dir }}"
    NVDA_REMOTE_DATA_DIR: "{{ nvda_remote_data_dir }}"
    NVDA_REMOTE_GID: "{{ nvda_remote_gid | string }}"
  register: nvda_remote_cert
  changed_when: "'issued' in nvda_remote_cert.stdout"
  notify: Restart NVDA Remote server

- name: Render NVDA Remote server configuration
  ansible.builtin.template:
    src: NVDARemoteServer.conf.j2
    dest: "{{ nvda_remote_data_dir }}/NVDARemoteServer.conf"
    owner: root
    group: "{{ nvda_remote_gid }}"
    mode: "0640"
  notify: Restart NVDA Remote server

- name: Pull pinned NVDA Remote server image
  ansible.builtin.command:
    argv: [docker, pull, --quiet, "{{ nvda_remote_image }}"]
  register: nvda_remote_pull
  changed_when: false

- name: Install NVDA Remote server unit
  ansible.builtin.template:
    src: nvda-remote-server.service.j2
    dest: "/etc/systemd/system/{{ nvda_remote_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart NVDA Remote server

- name: Install NVDA Remote certificate renewal units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - nvda-remote-cert-renew.service
    - nvda-remote-cert-renew.timer

- name: Enable NVDA Remote certificate renewal timer
  ansible.builtin.systemd_service:
    name: nvda-remote-cert-renew.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start NVDA Remote server
  ansible.builtin.systemd_service:
    name: "{{ nvda_remote_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Flush NVDA Remote server handlers
  ansible.builtin.meta: flush_handlers

- name: Wait for NVDA Remote server to listen
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ nvda_remote_port | int }}"
    timeout: 30
