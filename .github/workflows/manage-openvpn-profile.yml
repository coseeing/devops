name: Manage course OpenVPN profile

on:
  workflow_dispatch:
    inputs:
      action:
        description: Share the current profile or rotate and replace its certificate
        required: true
        type: choice
        options: [share, rotate]
      stack_name:
        description: Existing Linux EC2 CloudFormation stack
        required: true
        default: coseeing-stack-v2
      client_days:
        description: New certificate validity in days; used only for rotate
        required: true
        default: "30"
      confirm_rotation:
        description: For rotate, type ROTATE course-shared exactly
        required: false

permissions:
  contents: read

jobs:
  manage:
    runs-on: ubuntu-latest
    environment: a11y-village-production
    concurrency:
      group: openvpn-course-production
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-northeast-1
      PROFILE_SECRET_ID: prod/vms-portal/openvpn-profile
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTION_ROLE }}
          aws-region: ap-northeast-1
      - name: Validate requested profile operation
        env:
          ACTION: ${{ inputs.action }}
          CLIENT_DAYS: ${{ inputs.client_days }}
          CONFIRM_ROTATION: ${{ inputs.confirm_rotation }}
          STACK_NAME: ${{ inputs.stack_name }}
        run: |
          set -euo pipefail

          [[ "$ACTION" == share || "$ACTION" == rotate ]]
          [[ "$STACK_NAME" =~ ^[A-Za-z][-A-Za-z0-9]{0,127}$ ]]
          [[ "$CLIENT_DAYS" =~ ^[0-9]{1,3}$ ]]
          (( 10#$CLIENT_DAYS >= 1 && 10#$CLIENT_DAYS <= 365 ))
          if [[ "$ACTION" == rotate ]]; then
            [[ "$CONFIRM_ROTATION" == 'ROTATE course-shared' ]]
          fi
      - name: Discover OpenVPN host
        id: discover
        env:
          STACK_NAME: ${{ inputs.stack_name }}
        run: |
          set -euo pipefail

          HOST_IP=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`InstancePublicIp`].OutputValue | [0]' \
            --output text)
          [[ "$HOST_IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]
          echo "host_ip=$HOST_IP" >> "$GITHUB_OUTPUT"
      - name: Install EC2 SSH credentials
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.OPENVPN_SSH_KNOWN_HOSTS }}
          HOST_IP: ${{ steps.discover.outputs.host_ip }}
          SSH_KNOWN_HOSTS_PATH: ${{ runner.temp }}/openvpn-known-hosts
          SSH_KEY_PATH: ${{ runner.temp }}/openvpn-ec2-key
        run: |
          set -euo pipefail

          umask 077
          printf '%s\n' "$EC2_SSH_KEY" > "$SSH_KEY_PATH"
          printf '%s\n' "$EC2_SSH_KNOWN_HOSTS" > "$SSH_KNOWN_HOSTS_PATH"
          ssh-keygen -F "$HOST_IP" -f "$SSH_KNOWN_HOSTS_PATH" >/dev/null
      - name: Rotate shared OpenVPN certificate
        if: "inputs.action == 'rotate'"
        env:
          CLIENT_DAYS: ${{ inputs.client_days }}
          HOST_IP: ${{ steps.discover.outputs.host_ip }}
          SSH_KNOWN_HOSTS_PATH: ${{ runner.temp }}/openvpn-known-hosts
          SSH_KEY_PATH: ${{ runner.temp }}/openvpn-ec2-key
        run: |
          set -euo pipefail

          ssh -i "$SSH_KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_PATH" \
            "ubuntu@$HOST_IP" \
            "printf '%s\n' 'ROTATE course-shared' | sudo openvpn-course rotate --days '$CLIENT_DAYS'"
      - name: Publish current OpenVPN profile download secret
        env:
          HOST_IP: ${{ steps.discover.outputs.host_ip }}
          SSH_KNOWN_HOSTS_PATH: ${{ runner.temp }}/openvpn-known-hosts
          SSH_KEY_PATH: ${{ runner.temp }}/openvpn-ec2-key
        run: |
          set -euo pipefail

          SHARE_OUTPUT=$(ssh -i "$SSH_KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_PATH" \
            "ubuntu@$HOST_IP" \
            'sudo openvpn-course share')
          PROFILE_URL=${SHARE_OUTPUT%%$'\n'*}
          EXPIRY_LINE=$(printf '%s\n' "$SHARE_OUTPUT" | sed -n '2p')
          EXPIRES_AT=${EXPIRY_LINE#Expires no later than: }

          [[ "$PROFILE_URL" =~ ^https://[^[:space:]]+$ ]]
          [[ "$EXPIRY_LINE" == "Expires no later than: $EXPIRES_AT" ]]
          [[ "$EXPIRES_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          echo "::add-mask::${PROFILE_URL}"

          SECRET_JSON=$(jq -n --compact-output \
            --arg url "$PROFILE_URL" \
            --arg expires_at "$EXPIRES_AT" \
            '{url:$url,expires_at:$expires_at}')
          DESCRIBE_ERROR=$(mktemp)
          trap 'rm -f "$DESCRIBE_ERROR"' EXIT
          if aws secretsmanager describe-secret \
            --secret-id "$PROFILE_SECRET_ID" >/dev/null 2>"$DESCRIBE_ERROR"; then
            aws secretsmanager put-secret-value \
              --secret-id "$PROFILE_SECRET_ID" \
              --secret-string "$SECRET_JSON" >/dev/null
          elif grep -Fq 'ResourceNotFoundException' "$DESCRIBE_ERROR"; then
            aws secretsmanager create-secret \
              --name "$PROFILE_SECRET_ID" \
              --description "Temporary OpenVPN profile download URL" \
              --secret-string "$SECRET_JSON" >/dev/null
          else
            cat "$DESCRIBE_ERROR" >&2
            exit 1
          fi
      - name: Remove EC2 SSH credentials
        if: always()
        env:
          SSH_KNOWN_HOSTS_PATH: ${{ runner.temp }}/openvpn-known-hosts
          SSH_KEY_PATH: ${{ runner.temp }}/openvpn-ec2-key
        run: |
          set -euo pipefail

          if [ -f "$SSH_KEY_PATH" ]; then
            shred -u "$SSH_KEY_PATH" || rm -f "$SSH_KEY_PATH"
          fi
          if [ -f "$SSH_KNOWN_HOSTS_PATH" ]; then
            shred -u "$SSH_KNOWN_HOSTS_PATH" || rm -f "$SSH_KNOWN_HOSTS_PATH"
          fi
