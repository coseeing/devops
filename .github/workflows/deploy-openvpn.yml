name: Validate or deploy course OpenVPN

on:
  workflow_dispatch:
    inputs:
      action:
        description: Validate only or deploy
        required: true
        type: choice
        options: [validate, deploy]
      stack_name:
        description: Existing Linux EC2 CloudFormation stack
        required: true
        default: coseeing-stack-v2
      vpn_endpoint:
        description: Stable VPN hostname or IPv4 address
        required: true
      windows_subnet_id:
        description: Subnet containing the managed Windows VMs
        required: true
      vpn_cidr:
        description: OpenVPN client address network
        required: true
        default: 10.250.0.0/24
      client_days:
        description: Initial client certificate validity; ignored after it exists
        required: true
        default: "30"
      confirm_endpoint:
        description: For deploy, type vpn_endpoint exactly
        required: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: vms_portal
      - run: uv run pytest ../tests/openvpn -q
        working-directory: vms_portal
      - run: uvx cfn-lint cloudformation/openvpn-distribution-template.yml cloudformation/nvda-remote-ca-trust-template.yml
      - name: Validate OpenVPN shell scripts
        run: |
          set -euo pipefail
          for script in scripts/openvpn-course scripts/openvpn-course-firewall scripts/nvda-remote-cert; do
            bash -n "$script"
          done
      - run: python3 -m py_compile scripts/validate-openvpn-inputs.py ansible_yaml/filter_plugins/openvpn_filters.py
      - name: Validate OpenVPN playbook syntax
        run: >-
          uv run --project vms_portal ansible-playbook
          --syntax-check
          --inventory localhost,
          --connection local
          --extra-vars openvpn_endpoint=vpn.coseeing.org
          --extra-vars openvpn_vpn_cidr=10.250.0.0/24
          --extra-vars openvpn_windows_cidr=10.0.8.0/24
          --extra-vars openvpn_vpc_cidr=10.0.0.0/16
          --extra-vars openvpn_profile_bucket=openvpn-course-profile-example
          --extra-vars openvpn_client_days=30
          ansible_yaml/openvpn-server-playbook.yml

  deploy:
    if: "inputs.action == 'deploy' && inputs.confirm_endpoint == inputs.vpn_endpoint"
    needs: validate
    runs-on: ubuntu-latest
    environment: a11y-village-production
    concurrency:
      group: openvpn-course-production
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-northeast-1
      DISTRIBUTION_STACK_NAME: openvpn-course-profile-distribution
      NVDA_CA_TRUST_STACK_NAME: nvda-remote-ca-trust
      RUNTIME_ROLE_NAME: coseeing-ec2-common
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTION_ROLE }}
          aws-region: ap-northeast-1
      - name: Discover and normalize deployment inputs
        id: discover
        env:
          CLIENT_DAYS: ${{ inputs.client_days }}
          STACK_NAME: ${{ inputs.stack_name }}
          VPN_CIDR: ${{ inputs.vpn_cidr }}
          VPN_ENDPOINT: ${{ inputs.vpn_endpoint }}
          WINDOWS_SUBNET_ID: ${{ inputs.windows_subnet_id }}
        run: |
          set -euo pipefail

          [[ "$STACK_NAME" =~ ^[A-Za-z][-A-Za-z0-9]{0,127}$ ]]
          [[ "$WINDOWS_SUBNET_ID" =~ ^subnet-[a-f0-9]{8,17}$ ]]
          [[ "$CLIENT_DAYS" =~ ^[0-9]{1,3}$ ]]
          [[ "$VPN_ENDPOINT" =~ ^[A-Za-z0-9.-]{1,253}$ ]]
          [[ "$VPN_CIDR" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$ ]]

          STACK_OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output json)
          HOST_IP=$(jq -r '.[] | select(.OutputKey == "InstancePublicIp") | .OutputValue' <<<"$STACK_OUTPUTS")
          INSTANCE_ID=$(jq -r '.[] | select(.OutputKey == "InstanceId") | .OutputValue' <<<"$STACK_OUTPUTS")
          [[ "$HOST_IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]
          [[ "$INSTANCE_ID" =~ ^i-[a-f0-9]{8,17}$ ]]
          PRIVATE_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PrivateIpAddress' \
            --output text)
          [[ "$PRIVATE_IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]

          SUBNET_JSON=$(aws ec2 describe-subnets \
            --subnet-ids "$WINDOWS_SUBNET_ID" \
            --query 'Subnets[0].{cidr:CidrBlock,vpc:VpcId}' \
            --output json)
          WINDOWS_CIDR=$(jq -r .cidr <<<"$SUBNET_JSON")
          VPC_ID=$(jq -r .vpc <<<"$SUBNET_JSON")
          [[ "$WINDOWS_CIDR" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$ ]]
          [[ "$VPC_ID" =~ ^vpc-[a-f0-9]{8,17}$ ]]
          VPC_CIDR=$(aws ec2 describe-vpcs \
            --vpc-ids "$VPC_ID" \
            --query 'Vpcs[0].CidrBlock' \
            --output text)
          [[ "$VPC_CIDR" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$ ]]

          NORMALIZED=$(python3 scripts/validate-openvpn-inputs.py \
            --endpoint "$VPN_ENDPOINT" \
            --vpn-cidr "$VPN_CIDR" \
            --windows-cidr "$WINDOWS_CIDR" \
            --vpc-cidr "$VPC_CIDR" \
            --client-days "$CLIENT_DAYS")

          ENDPOINT=$(jq -r .endpoint <<<"$NORMALIZED")
          VPN_CIDR=$(jq -r .vpn_cidr <<<"$NORMALIZED")
          WINDOWS_CIDR=$(jq -r .windows_cidr <<<"$NORMALIZED")
          VPC_CIDR=$(jq -r .vpc_cidr <<<"$NORMALIZED")
          CLIENT_DAYS=$(jq -r .client_days <<<"$NORMALIZED")
          # OpenVPN server mode takes the first host address of the VPN network.
          VPN_SERVER_IP=$(python3 -c 'import ipaddress, sys; print(next(ipaddress.ip_network(sys.argv[1]).hosts()))' "$VPN_CIDR")

          {
            echo "host_ip=$HOST_IP"
            echo "instance_id=$INSTANCE_ID"
            echo "private_ip=$PRIVATE_IP"
            echo "vpn_server_ip=$VPN_SERVER_IP"
            echo "endpoint=$ENDPOINT"
            echo "vpn_cidr=$VPN_CIDR"
            echo "windows_cidr=$WINDOWS_CIDR"
            echo "vpc_cidr=$VPC_CIDR"
            echo "client_days=$CLIENT_DAYS"
          } >> "$GITHUB_OUTPUT"
      - name: Deploy profile distribution
        id: distribution
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "$DISTRIBUTION_STACK_NAME" \
            --template-file cloudformation/openvpn-distribution-template.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides ExistingRoleName="$RUNTIME_ROLE_NAME" \
            --no-fail-on-empty-changeset

          PROFILE_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DISTRIBUTION_STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`ProfileBucketName`].OutputValue | [0]' \
            --output text)
          [[ "$PROFILE_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]

          echo "profile_bucket=$PROFILE_BUCKET" >> "$GITHUB_OUTPUT"
      - name: Install EC2 SSH credentials
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.OPENVPN_SSH_KNOWN_HOSTS }}
          HOST_IP: ${{ steps.discover.outputs.host_ip }}
          SSH_KNOWN_HOSTS_PATH: ${{ runner.temp }}/openvpn-known-hosts
          SSH_KEY_PATH: ${{ runner.temp }}/openvpn-ec2-key
        run: |
          set -euo pipefail

          umask 077
          printf '%s\n' "$EC2_SSH_KEY" > "$SSH_KEY_PATH"
          printf '%s\n' "$EC2_SSH_KNOWN_HOSTS" > "$SSH_KNOWN_HOSTS_PATH"
          ssh-keygen -F "$HOST_IP" -f "$SSH_KNOWN_HOSTS_PATH" >/dev/null
      - name: Install Ansible Core
        run: python3 -m pip install ansible-core==2.21.3
      - name: Deploy OpenVPN with Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
          ANSIBLE_SSH_ARGS: >-
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=${{ runner.temp }}/openvpn-known-hosts
          CLIENT_DAYS: ${{ steps.discover.outputs.client_days }}
          ENDPOINT: ${{ steps.discover.outputs.endpoint }}
          HOST_IP: ${{ steps.discover.outputs.host_ip }}
          PROFILE_BUCKET: ${{ steps.distribution.outputs.profile_bucket }}
          SSH_KEY_PATH: ${{ runner.temp }}/openvpn-ec2-key
          VPN_CIDR: ${{ steps.discover.outputs.vpn_cidr }}
          VPC_CIDR: ${{ steps.discover.outputs.vpc_cidr }}
          WINDOWS_CIDR: ${{ steps.discover.outputs.windows_cidr }}
        run: |
          set -euo pipefail

          INVENTORY="$RUNNER_TEMP/openvpn-inventory"
          printf '[openvpn]\n%s ansible_user=ubuntu ansible_ssh_private_key_file=%s\n' \
            "$HOST_IP" "$SSH_KEY_PATH" > "$INVENTORY"

          ansible-playbook \
            --inventory "$INVENTORY" \
            --extra-vars "openvpn_endpoint=$ENDPOINT" \
            --extra-vars "openvpn_vpn_cidr=$VPN_CIDR" \
            --extra-vars "openvpn_windows_cidr=$WINDOWS_CIDR" \
            --extra-vars "openvpn_vpc_cidr=$VPC_CIDR" \
            --extra-vars "openvpn_profile_bucket=$PROFILE_BUCKET" \
            --extra-vars "openvpn_client_days=$CLIENT_DAYS" \
            --extra-vars "openvpn_aws_region=$AWS_REGION" \
            --extra-vars "openvpn_verify_s3=true" \
            ansible_yaml/openvpn-server-playbook.yml
      - name: Verify remote OpenVPN service state
        env:
          HOST_IP: ${{ steps.discover.outputs.host_ip }}
          SSH_KNOWN_HOSTS_PATH: ${{ runner.temp }}/openvpn-known-hosts
          SSH_KEY_PATH: ${{ runner.temp }}/openvpn-ec2-key
        run: |
          set -euo pipefail

          ssh -i "$SSH_KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_PATH" \
            "ubuntu@$HOST_IP" \
            'sudo bash -se' <<'REMOTE_CHECKS'
          systemctl is-active --quiet openvpn-course-firewall openvpn-server@course
          systemctl is-enabled --quiet openvpn-course-firewall openvpn-server@course
          ss -lun | grep -Eq "[:.]1194[[:space:]]"
          test "$(sysctl -n net.ipv4.ip_forward)" = 1
          iptables --version | grep -Fq nf_tables
          iptables -w 5 -t filter -C FORWARD -j DOCKER-USER
          forward_rules=$(iptables -w 5 -t filter -S FORWARD)
          first_forward_rule=$(printf '%s\n' "$forward_rules" | awk '$1 == "-A" && $2 == "FORWARD" { print; exit }')
          test "$first_forward_rule" = '-A FORWARD -j DOCKER-USER'
          docker_user_rules=$(iptables -w 5 -t filter -S DOCKER-USER)
          active_course_chain=$(printf '%s\n' "$docker_user_rules" | awk '$1 == "-A" && $2 == "DOCKER-USER" && $3 == "-m" && $4 == "comment" && $5 == "--comment" && $6 == "openvpn-course-forward" && $7 == "-j" && ($8 == "OPENVPN-COURSE-A" || $8 == "OPENVPN-COURSE-B") { print $8 }')
          test "$(printf '%s\n' "$active_course_chain" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          case "$active_course_chain" in
            OPENVPN-COURSE-A|OPENVPN-COURSE-B) ;;
            *) exit 1 ;;
          esac
          iptables -w 5 -t filter -S "$active_course_chain" >/dev/null
          nft list table inet openvpn_course_input >/dev/null
          nft list table ip openvpn_course_nat >/dev/null
          nft list chain inet openvpn_course_input input | grep -Fq 'tcp dport 6837 drop'
          systemctl is-active --quiet nvda-remote-server
          systemctl is-enabled --quiet nvda-remote-server
          systemctl is-enabled --quiet nvda-remote-cert-renew.timer
          openssl verify -CAfile /etc/nvda-remote-server/ca/ca.crt /var/lib/nvda-remote-server/server.crt >/dev/null
          openssl x509 -in /etc/nvda-remote-server/ca/ca.crt -noout -checkend 31536000 >/dev/null
          ss -ltn | grep -Eq "[:.]6837[[:space:]]"
          REMOTE_CHECKS
      - name: Read NVDA Remote CA certificate
        id: nvda_ca
        env:
          HOST_IP: ${{ steps.discover.outputs.host_ip }}
          SSH_KNOWN_HOSTS_PATH: ${{ runner.temp }}/openvpn-known-hosts
          SSH_KEY_PATH: ${{ runner.temp }}/openvpn-ec2-key
        run: |
          set -euo pipefail

          # Public certificate only; the CA private key never leaves the host.
          CA_PEM=$(ssh -i "$SSH_KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_PATH" \
            "ubuntu@$HOST_IP" \
            'sudo cat /etc/nvda-remote-server/ca/ca.crt')
          CA_DER_BASE64=$(openssl x509 -outform DER <<<"$CA_PEM" | base64 -w0)
          CA_SUBJECT=$(openssl x509 -noout -subject -nameopt RFC2253 <<<"$CA_PEM")
          [[ "$CA_SUBJECT" == "subject=CN=Coseeing NVDA Remote CA" ]]
          CA_FINGERPRINT=$(openssl x509 -noout -fingerprint -sha256 <<<"$CA_PEM" | cut -d= -f2)
          CA_EXPIRES_AT=$(date -u -d "$(openssl x509 -noout -enddate <<<"$CA_PEM" | cut -d= -f2)" +%F)
          {
            echo "der_base64=$CA_DER_BASE64"
            echo "fingerprint=$CA_FINGERPRINT"
            echo "expires_at=$CA_EXPIRES_AT"
            echo "pem<<NVDA_CA_PEM"
            printf '%s\n' "$CA_PEM"
            echo "NVDA_CA_PEM"
          } >> "$GITHUB_OUTPUT"
      - name: Trust NVDA Remote CA on managed Windows VMs
        env:
          CA_DER_BASE64: ${{ steps.nvda_ca.outputs.der_base64 }}
          CA_EXPIRES_AT: ${{ steps.nvda_ca.outputs.expires_at }}
          PRIVATE_IP: ${{ steps.discover.outputs.private_ip }}
          VPN_SERVER_IP: ${{ steps.discover.outputs.vpn_server_ip }}
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "$NVDA_CA_TRUST_STACK_NAME" \
            --template-file cloudformation/nvda-remote-ca-trust-template.yml \
            --parameter-overrides \
              CaCertificateDerBase64="$CA_DER_BASE64" \
              CaExpiresAt="$CA_EXPIRES_AT" \
              VpnHost="$VPN_SERVER_IP" \
              VmHost="$PRIVATE_IP" \
            --no-fail-on-empty-changeset
      - name: Deployment summary
        env:
          NVDA_CA_EXPIRES_AT: ${{ steps.nvda_ca.outputs.expires_at }}
          NVDA_CA_FINGERPRINT: ${{ steps.nvda_ca.outputs.fingerprint }}
          NVDA_CA_PEM: ${{ steps.nvda_ca.outputs.pem }}
          PROFILE_BUCKET: ${{ steps.distribution.outputs.profile_bucket }}
        run: |
          set -euo pipefail

          {
            echo '### OpenVPN deployment'
            echo
            echo "- Distribution stack: \`$DISTRIBUTION_STACK_NAME\`"
            echo "- Profile bucket: \`$PROFILE_BUCKET\`"
            echo "- Deployment: \`passed\`"
            echo "- Remote checks: \`passed\`"
            echo "- NVDA Remote server: \`TCP 6837\`"
            echo "- NVDA Remote CA trust stack: \`$NVDA_CA_TRUST_STACK_NAME\`"
            echo "- NVDA Remote CA SHA-256: \`$NVDA_CA_FINGERPRINT\`"
            echo "- NVDA Remote CA expires: \`$NVDA_CA_EXPIRES_AT\`"
            echo
            echo 'VPN users download the one-click CA installer from VMS Portal.'
            echo 'Manual fallback: save the public CA below as `nvda-remote-ca.crt`:'
            echo
            echo '```'
            printf '%s\n' "$NVDA_CA_PEM"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove EC2 SSH credentials
        if: always()
        env:
          SSH_KNOWN_HOSTS_PATH: ${{ runner.temp }}/openvpn-known-hosts
          SSH_KEY_PATH: ${{ runner.temp }}/openvpn-ec2-key
        run: |
          set -euo pipefail

          if [ -f "$SSH_KEY_PATH" ]; then
            shred -u "$SSH_KEY_PATH" || rm -f "$SSH_KEY_PATH"
          fi
          if [ -f "$SSH_KNOWN_HOSTS_PATH" ]; then
            shred -u "$SSH_KNOWN_HOSTS_PATH" || rm -f "$SSH_KNOWN_HOSTS_PATH"
          fi
